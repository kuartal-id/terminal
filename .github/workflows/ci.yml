name: CI

# Runs on every push and pull request. A red CI means: do not merge, do not deploy.
on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build, guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Guardrails (protected files, secrets, stable contracts)
        run: node scripts/check-guardrails.mjs
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
      - name: Smoke test the production server (demo data)
        run: |
          # Production default: data endpoints require Kuartal ID login.
          DATA_MODE=demo PORT=8787 node server/dist/index.js &
          sleep 2
          curl -fsS localhost:8787/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8787/api/quotes?symbols=IHSG')" = 401
          curl -fsS localhost:8787/ | grep -q "Kuartal Terminal"
          kill %1
          # With the gate off, the data API itself works.
          DATA_MODE=demo REQUIRE_LOGIN=false PORT=8788 node server/dist/index.js &
          sleep 2
          curl -fsS "localhost:8788/api/quotes?symbols=IHSG,BTC" > /dev/null

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: kuartal-terminal:ci
