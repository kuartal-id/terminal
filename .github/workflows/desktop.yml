name: Desktop app

# Builds the Windows / macOS / Linux desktop app (Tauri) and attaches the
# installers to a draft GitHub Release. Trigger by pushing a tag like
# `desktop-v0.1.0`, or run manually from the Actions tab.
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Tauri CLI
        working-directory: desktop
        run: npm install
      - name: Generate icons from the Kuartal mark
        working-directory: desktop
        run: npx tauri icon app-icon.png
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-dev-{0}', github.run_number) }}
          releaseName: Kuartal Terminal Desktop ${{ github.ref_type == 'tag' && github.ref_name || 'dev build' }}
          releaseBody: Desktop wrapper for terminal.kuartalsystems.com. Unsigned build — see desktop/README.md.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
