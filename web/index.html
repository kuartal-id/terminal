<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1319" />
    <meta name="description" content="Kuartal Terminal — free market insights for Kuartal ID members: IDX, rupiah, global markets, macro, crypto and news in one workspace." />
    <meta property="og:title" content="Kuartal Terminal" />
    <meta property="og:description" content="Markets, macro and news in one workspace — built for Indonesia." />
    <meta property="og:image" content="/icon-512.png" />
    <title>Kuartal Terminal</title>
    <link rel="icon" type="image/png" href="/icon-64.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply saved theme before first paint (no flash).
      try {
        var s = JSON.parse(localStorage.getItem('kuartal-terminal:v1') || 'null');
        if (s && s.theme) document.documentElement.dataset.theme = s.theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Kuartal Terminal needs JavaScript enabled.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
